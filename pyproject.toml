[project]
name = "erpnextswiss"
authors = [
    { name = "libracore", email = "info@libracore.com" },
]
description = "ERPNext application for Switzerland-specific use cases"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dynamic = ["version"]

# Runtime dependencies.
#
# Only packages that are NOT already provided by frappe/erpnext are listed here.
# frappe provides: beautifulsoup4 (bs4), Pillow, requests, pypdf, ...
# erpnext provides: Unidecode, python-stdnum, ...
# The framework itself (frappe/erpnext) is declared via
# [tool.bench.frappe-dependencies] below, NOT as a pip dependency -- pinning
# "frappe" here pulls the unrelated `frappe==0.0.1` stub from PyPI and breaks
# `uv pip install -e` inside a real bench (this was the v16 install blocker).
#
# Heavy / optional / licensed dependencies live in [project.optional-dependencies]
# so a default install stays lean and cannot be broken by a single package that
# lacks a wheel for the active Python version.
dependencies = [
    "lxml",           # ISO 20022 (pain.001 / camt.053) + ESTV MWST XML + CardDAV
    "icalendar",      # CalDAV calendar sync
    "factur-x>=2.3",  # ZUGFeRD / Factur-X e-invoice generation
    "pymupdf",        # PDF reading (ZUGFeRD embedded XML / QR extraction)
]

[project.optional-dependencies]
# QR-code reading from incoming (ZUGFeRD) PDFs -- heavy OpenCV/NumPy stack.
ocr = [
    "opencv-python",
    "numpy",
]
# EBICS bank connectivity. `fintech` is a commercial, licensed library; the code
# imports it defensively so the app installs and migrates without it.
ebics = [
    "fintech",
]
# Planzer shipping upload over SFTP. `pysftp` ships as a source-only sdist.
sftp = [
    "pysftp",
]
# Everything optional at once.
all = [
    "opencv-python",
    "numpy",
    "fintech",
    "pysftp",
]

[project.urls]
Homepage = "https://www.libracore.com"
Repository = "https://github.com/libracore/erpnextswiss"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe framework compatibility. Read by bench (not pip) to gate installation.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "erpnextswiss"
