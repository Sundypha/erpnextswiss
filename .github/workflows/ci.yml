name: CI (version-16)

on:
  push:
    branches:
      - version-16
  pull_request:
    branches:
      - version-16
  workflow_dispatch:

concurrency:
  group: erpnextswiss-ci-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-migrate-build:
    name: install-app + migrate + build (frappe/erpnext/hrms version-16, Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: "root"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python compiles & no merge conflicts
        run: |
          python -m compileall -q "${GITHUB_WORKSPACE}/erpnextswiss"
          if grep -lr --exclude-dir=node_modules --exclude-dir=.git "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
            echo "Found merge conflicts"; exit 1
          fi

      - name: Verify packaging installs cleanly on Python 3.14 (uv pip install -e)
        run: |
          python -m pip install --upgrade pip uv
          python -m uv venv /tmp/pkgcheck
          # Editable install must succeed and must NOT pull the `frappe` PyPI stub.
          VIRTUAL_ENV=/tmp/pkgcheck python -m uv pip install -e "${GITHUB_WORKSPACE}"
          if VIRTUAL_ENV=/tmp/pkgcheck python -m uv pip list | grep -i '^frappe '; then
            echo "ERROR: the 'frappe' PyPI stub was installed as a dependency"; exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add site host
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install bench + frappe + erpnext + hrms + erpnextswiss
        run: bash "${GITHUB_WORKSPACE}/.github/helper/install.sh"

      - name: bench migrate
        run: cd ~/frappe-bench && bench --site test_site migrate

      - name: bench build --app erpnextswiss
        run: cd ~/frappe-bench && bench build --app erpnextswiss

      - name: Smoke test (core feature modules import + ISO 20022 XSD validator)
        run: cd ~/frappe-bench && bench --site test_site execute erpnextswiss.erpnextswiss.smoke_test.run

      - name: Unit tests (offline Swiss holiday computation)
        run: cd ~/frappe-bench && bench --site test_site run-tests --module erpnextswiss.erpnextswiss.test_calendar

      - name: Show bench logs (always)
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true
